[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "free-llm-availability"
version = "0.1.0"
description = "Free-LLM availability dashboard: probes free-tier LLM models and builds a GitHub Pages site."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Free LLM Availability contributors" }]
dependencies = []

[tool.setuptools]
py-modules = ["common", "probe_models", "generate_site"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
# generate_site.py is upstream code that builds the availability site; it's
# regenerated by the update-models.yml bot, so we don't lint/format it here.
extend-exclude = ["docs", ".venv", "snapshots", "generate_site.py"]

[tool.ruff.lint]
# Keep the bar reasonable for a sync script: correctness + obvious bugs.
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes (unused imports, undefined names)
    "W",   # pycodestyle warnings
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",   # line length handled by formatter; we don't want noisy line-wrap edits
    "B008",   # function call in default arg (used for some fetchers)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]          # tests may import after sys.path tweaks
